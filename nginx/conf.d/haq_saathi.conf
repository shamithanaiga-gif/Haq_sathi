# ==============================================================================
# Haq Saathi - NGINX Server Block
# Production TLS 1.3 Ingress with Security Headers and Static Asset Optimization
# ==============================================================================

# HTTP Server: ACME challenge and HTTPS 301 redirection
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN:-_};

    # Let's Encrypt Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: TLS Termination & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN:-_};

    # SSL Certificates (managed by Certbot or mounted)
    ssl_certificate /etc/letsencrypt/live/${DOMAIN:-localhost}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:-localhost}/privkey.pem;

    # SSL Protocol & Cipher Hardening (A+ Rating on SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # PWA & Audio Security Headers (Mandatory for Web Speech API and Privacy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "microphone=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for static PWA assets
    root /usr/share/nginx/html;

    # 1. PWA Service Worker (Always Fresh, No-Cache, Full-Scope)
    location ~* /(sw\.js|static/sw\.js)$ {
        alias /usr/share/nginx/html/static/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Permissions-Policy "microphone=(self)" always;
        add_header Content-Type "application/javascript" always;
        expires -1;
    }

    # 2. PWA Web App Manifest
    location ~* /(manifest\.json|static/manifest\.json)$ {
        alias /usr/share/nginx/html/static/manifest.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Permissions-Policy "microphone=(self)" always;
        add_header Content-Type "application/manifest+json" always;
        expires -1;
    }

    # 3. Static Assets: Long Immutable Cache for CSS, JS, Fonts, Icons
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Permissions-Policy "microphone=(self)" always;
        access_log off;
    }

    # 4. Frontend Root Index
    location = / {
        alias /usr/share/nginx/html/static/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "microphone=(self)" always;
    }

    # 5. FastAPI REST Endpoints, OpenAPI Docs, and WebSocket Ingress
    location ~ ^/(api/|docs|openapi\.json|redoc) {
        proxy_pass http://haq_backend;
        
        # HTTP Version & WebSocket Upgrade Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client IP & Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Generous Timeouts for Conversational Voice Pauses & Streaming Responses
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Proxy Buffering Tuning
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 6. Fallback Route
    location / {
        alias /usr/share/nginx/html/static/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "microphone=(self)" always;
    }
}
